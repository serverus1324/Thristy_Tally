name: CI Pipeline Spring Boot

on:
  push:
    branches: [ master, develop ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./CalcGastosU
    steps:
      - uses: actions/checkout@v4
      
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Build y pruebas con cobertura
        run: mvn clean test jacoco:report
      
      - name: Verificar que el reporte existe
        run: |
          echo "=== Contenido de target/site/jacoco ==="
          ls -la target/site/jacoco/ || echo "❌ No existe la carpeta"
      
      - name: Publicar reporte como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: reporte-jacoco
          path: CalcGastosU/target/site/jacoco  # ✅ Ruta desde la raíz