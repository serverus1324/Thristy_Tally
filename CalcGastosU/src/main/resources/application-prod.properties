# ==============================================================
# PERFIL: PRODUCCIÓN (spring.profiles.active=prod)
# TODAS las variables se inyectan via variables de entorno del servidor.
# NUNCA hardcodear secretos aquí.
# ==============================================================

# MongoDB (definir en entorno de despliegue)
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:CalcGastosU}

# JWT (definir en entorno de despliegue)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:7200000}

# CORS: origen del frontend en producción (definir en entorno)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
