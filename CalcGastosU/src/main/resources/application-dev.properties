# ==============================================================
# PERFIL: DESARROLLO (spring.profiles.active=dev)
# Todas las variables sensibles se leen DESDE .env via spring-dotenv
# ==============================================================

# MongoDB (OBLIGATORIO: definir MONGODB_URI en .env)
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:CalcGastosU}

# JWT (OBLIGATORIO: JWT_SECRET >= 32 chars en .env; expiración 2h = 7.200.000 ms)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:7200000}

# CORS: solo frontend Vite en desarrollo
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
